name: E2E full

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # About 35 minutes, so pull requests run it only when the suite's own setup
  # changes; the nightly run covers the rest.
  pull_request:
    paths:
      - 'apps/editor/playwright.config.ts'
      - 'apps/editor/package.json'
      - '.github/actions/setup/**'
      - '.github/workflows/e2e-full.yml'

concurrency:
  group: freshcoat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(bun -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/editor
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/editor
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/editor
      - run: bun run e2e:desktop
        working-directory: apps/editor
        env:
          FRESHCOAT_PREVIEW: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: freshcoat-e2e-full-report
          path: |
            apps/editor/playwright-report
            apps/editor/test-results
          retention-days: 7

  notify:
    needs: e2e-desktop
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = "Nightly full e2e run failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "e2e-nightly",
            });
            const body = `The full desktop Playwright run failed on ${context.sha.slice(0, 7)}: ${run}`;
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["e2e-nightly"] });
            }
