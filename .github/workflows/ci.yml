name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches: [master]

concurrency:
  group: freshcoat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run check:boundaries
      - run: bun run check:links
      - run: bun run check:notices
      - run: bun run test:scripts
      - run: bun run check
      - run: bun run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run test

  bench:
    runs-on: ubuntu-latest
    # Reports without failing the workflow until its numbers hold steady on
    # hosted runners.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run bench:render --out bench-render.json
        working-directory: apps/editor
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-render
          path: apps/editor/bench-render.json
          if-no-files-found: ignore
          retention-days: 30

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(bun -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/editor
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: apps/editor
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit
        working-directory: apps/editor
      - run: bun run e2e:smoke
        working-directory: apps/editor
        env:
          FRESHCOAT_PREVIEW: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: freshcoat-e2e-report
          path: |
            apps/editor/playwright-report
            apps/editor/test-results
          retention-days: 7

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup
      - run: bun run release:pack
      - run: bun run release:check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: release:check on Node 22
        run: bun run release:check
      - run: bunx build-figma-plugin --minify
        working-directory: apps/figma-plugin
      - run: bun run release:figma
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/releases/
          if-no-files-found: error
          retention-days: 7
