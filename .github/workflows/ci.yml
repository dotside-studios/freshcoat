name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches: [master]

concurrency:
  group: freshcoat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:boundaries
      - run: bun run check:links
      - run: bun run check:notices
      - run: bun run test:scripts
      - run: bun run --cwd packages/ui check
      - run: bun run --cwd packages/workspace check
      - run: bun run --cwd apps/editor check
      - run: bun run --cwd apps/figma-plugin check
      - run: bun run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui typecheck
      - run: bun run --cwd packages/workspace typecheck
      - run: bun run --cwd packages/engine typecheck
      - run: bun run --cwd apps/editor typecheck
      - run: bun run --cwd apps/figma-plugin typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/engine test
      - run: bun run --cwd packages/coatfile test
      - run: bun run --cwd packages/for-print test
      - run: bun run --cwd packages/ui test
      - run: bun run --cwd packages/workspace test
      - run: bun run --cwd apps/editor test
      - run: bun run --cwd apps/figma-plugin test

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - id: playwright
        run: echo "version=$(bun -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/editor
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/editor
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/editor
      - run: bun run e2e:smoke
        working-directory: apps/editor
        env:
          FRESHCOAT_PREVIEW: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freshcoat-e2e-report
          path: |
            apps/editor/playwright-report
            apps/editor/test-results
          retention-days: 7

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run release:pack
      - run: bun run release:check
      - run: bunx build-figma-plugin --minify
        working-directory: apps/figma-plugin
      - run: bun run release:figma
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/releases/
          if-no-files-found: error
          retention-days: 7
