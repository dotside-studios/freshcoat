name: Feature request
description: Suggest an improvement to a Freshcoat package or application
labels: [enhancement]
body:
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Engine, coatfile, for-print, workspace, UI kit, Studio, Figma plugin or repository tooling. Say if it spans several components.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The job, not the solution. Include API or application context so we know where it belongs.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What gets in the way today
      description: What you tried in Freshcoat, and where it stopped you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work, if you have an idea. Other tools that do it well are useful too.
  - type: checkboxes
    id: format
    attributes:
      label: Template format
      options:
        - label: This needs something the template format can't express yet
