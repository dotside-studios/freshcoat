name: Bug report
description: Something in a Freshcoat package or application does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the affected component's README and open issues first. For a security problem, follow SECURITY.md and report privately.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Engine (@freshcoat-js/engine)
        - Template format (@freshcoat-js/coatfile)
        - Print utilities (@freshcoat-js/for-print)
        - Workspace model and export planning
        - Shared UI kit
        - Freshcoat Studio
        - Figma plugin
        - Build, release tooling or documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or minimal reproduction
      description: For an SDK issue, include a small code example. For an application issue, include the steps and a sample or starter when useful.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      description: Node or Bun for an SDK issue; browser for Studio; Figma desktop or web for the plugin. Include versions when relevant.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: The affected package version, repository commit or Studio deployment URL.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files, logs or screenshots
      description: Attach a minimal example, template or workspace if useful. Remove private data first.
